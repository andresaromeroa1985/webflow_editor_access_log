name: Nightly Webflow activity sync

# Webflow Cloud has no built-in cron, so the schedule lives here and calls the
# app's /api/sync endpoint. The endpoint processes a batch of sites per request
# and returns the next offset; this job loops until it reports done.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC ≈ 02:00 PT
  workflow_dispatch:
    inputs:
      batch:
        description: "Sites per request (lower this if you see 504s)"
        default: "10"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Page through all sites
        env:
          APP_URL: ${{ secrets.APP_URL }} # e.g. https://your-app.webflow.io
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BATCH: ${{ github.event.inputs.batch || '10' }}
        run: |
          set -uo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set."
            exit 1
          fi

          offset=0
          total_events=0
          total_errors=0
          giveups=0
          MAX_RETRIES=3

          for i in $(seq 1 500); do
            attempt=0
            response=""

            # A batch can exceed the Worker's wall-clock budget and return 504.
            # Retrying the same offset is safe and cheap: every site already
            # synced carries a watermark, so the retry skips straight past it.
            while [ "$attempt" -lt "$MAX_RETRIES" ]; do
              attempt=$((attempt + 1))

              http_code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
                --max-time 300 \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${APP_URL}/api/sync?offset=${offset}&batch=${BATCH}" || echo "000")

              if [ "$http_code" = "200" ]; then
                response=$(cat /tmp/resp.json)
                break
              fi

              echo "  offset=${offset} attempt ${attempt}/${MAX_RETRIES} failed (HTTP ${http_code})"

              if [ "$http_code" = "401" ]; then
                echo "::error::401 Unauthorized — CRON_SECRET does not match the app's env var, or the app is behind workspace access control that blocks this runner."
                exit 1
              fi

              sleep 10
            done

            if [ -z "$response" ]; then
              echo "::warning::Giving up on offset=${offset} after ${MAX_RETRIES} attempts; skipping ahead."
              giveups=$((giveups + 1))
              offset=$((offset + BATCH))
              continue
            fi

            echo "$response" | jq -c '{offset, totalSites, sitesProcessed, eventsInserted, errors}'

            inserted=$(echo "$response" | jq -r '.eventsInserted // 0')
            errs=$(echo "$response" | jq -r '.errors // 0')
            total_events=$((total_events + inserted))
            total_errors=$((total_errors + errs))

            if [ "$(echo "$response" | jq -r '.done')" = "true" ]; then
              echo "✓ sync complete"
              break
            fi

            offset=$(echo "$response" | jq -r '.nextOffset')
            sleep 3
          done

          {
            echo "### Webflow sync"
            echo "- Events inserted: **${total_events}**"
            echo "- Site errors: **${total_errors}**"
            echo "- Batches abandoned: **${giveups}**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$total_errors" -gt 0 ]; then
            echo "::warning::${total_errors} sites reported errors — check the sites table for sync_error values."
          fi

          if [ "$giveups" -gt 0 ]; then
            echo "::warning::${giveups} batches timed out repeatedly and were skipped. They'll be retried on the next run; if it persists, lower the batch input."
          fi

      - name: Registrar enrichment (RDAP + name.com)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          # Looks up registrars for domains never checked or checked >30 days
          # ago, 25 per call, until none remain. Also refreshes the name.com
          # account match once per 24h (when credentials are configured).
          # Steady state this is a handful of calls; the first run is ~25.

          total_checked=0
          for i in $(seq 1 100); do
            http_code=$(curl -sS -o /tmp/enrich.json -w "%{http_code}" \
              --max-time 300 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/domains/enrich?limit=25" || echo "000")

            if [ "$http_code" != "200" ]; then
              echo "::warning::enrich returned HTTP ${http_code}; stopping. Remaining domains will be picked up tomorrow."
              break
            fi

            jq -c '{done, rdap: {checked: .rdap.checked, remaining: .rdap.remaining, errors: .rdap.errors}, namecom: .namecom}' /tmp/enrich.json

            checked=$(jq -r '.rdap.checked // 0' /tmp/enrich.json)
            total_checked=$((total_checked + checked))

            if [ "$(jq -r '.done' /tmp/enrich.json)" = "true" ]; then
              echo "✓ enrichment complete"
              break
            fi

            # Be polite to the registries.
            sleep 3
          done

          echo "- Registrar lookups performed: **${total_checked}**" >> "$GITHUB_STEP_SUMMARY"
